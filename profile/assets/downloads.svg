<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="dl-title dl-desc">
  <title id="dl-title">29,017 downloads on npm</title>
  <desc id="dl-desc">29,017 downloads on npm across all three a11y-hd packages since December 2025: engine 12,946, standards 9,560 and components 6,511. Updated 2026-10-18.</desc>
  <defs>
