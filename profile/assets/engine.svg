<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="engine-title engine-desc">
  <title id="engine-title">@holmdigital/engine: from a WCAG failure to the exact legal clause</title>
  <desc id="engine-desc">A terminal runs npx hd-a11y-scan https://holmdigital.se and reports a compliance score of 100/100 with low legal risk. Next to it, one finding is mapped step by step: an image without alt text fails WCAG 1.1.1 Non-text Content, which is clause 9.1.1.1 in EN 301 549, covered by the EAA Annex I and WAD Article 4, and in Sweden for the private sector by Lag (2023:254), enforced by PTS.</desc>
  <defs>
    <linearGradient id="ebg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0f1d33"/>
    </linearGradient>
    <radialGradient id="eglow" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="ecard"><rect width="1200" height="660" rx="24"/></clipPath>
  </defs>
  <style>
    text { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mono, .mono text { font-family: "Cascadia Mono", Consolas, "SF Mono", Menlo, "DejaVu Sans Mono", monospace; }
    .tl { animation: fade 0.35s ease-out backwards; }
    .bar { transform-box: fill-box; transform-origin: left center; animation: grow 0.6s ease-out backwards; }
    .node { animation: slide 0.45s ease-out backwards; }
    .d1 { animation-delay: 0.2s; } .d2 { animation-delay: 0.5s; } .d3 { animation-delay: 0.8s; }
    .d4 { animation-delay: 1.1s; } .d5 { animation-delay: 1.3s; } .d6 { animation-delay: 1.5s; }
    .d7 { animation-delay: 1.7s; } .d8 { animation-delay: 2.0s; }
    .n1 { animation-delay: 1.8s; } .n2 { animation-delay: 2.05s; } .n3 { animation-delay: 2.3s; }
    .n4 { animation-delay: 2.55s; } .n5 { animation-delay: 2.8s; }
    @keyframes fade { from { opacity: 0; } }
    @keyframes grow { from { transform: scaleX(0); } }
    @keyframes slide { from { opacity: 0; transform: translateX(16px); } }
    @media (prefers-reduced-motion: reduce) {
      .tl, .bar, .node { animation: none; }
    }
  </style>

  <g clip-path="url(#ecard)">
    <rect width="1200" height="660" fill="url(#ebg)"/>
    <rect width="1200" height="660" fill="url(#eglow)"/>
  </g>
  <rect x="1" y="1" width="1198" height="658" rx="23" fill="none" stroke="#1e3a5f" stroke-width="2"/>

  <text x="48" y="66" class="mono" font-size="18" font-weight="700" fill="#7dd3fc">@holmdigital/engine</text>
  <text x="48" y="110" font-size="34" font-weight="700" fill="#f8fafc">From a WCAG failure to the exact legal clause</text>
  <text x="48" y="144" font-size="19" fill="#b8c4d4">One scan maps each finding to EN 301 549, EU law and national law in 17 jurisdictions.</text>

  <!-- Terminal -->
  <rect x="48" y="184" width="600" height="428" rx="14" fill="#020617" stroke="#334155" stroke-width="2"/>
  <path d="M62 185 H634 A13 13 0 0 1 647 198 V224 H49 V198 A13 13 0 0 1 62 185 Z" fill="#1e293b"/>
  <circle cx="74" cy="204" r="6" fill="#f87171" fill-opacity="0.85"/>
  <circle cx="94" cy="204" r="6" fill="#fbbf24" fill-opacity="0.85"/>
  <circle cx="114" cy="204" r="6" fill="#4ade80" fill-opacity="0.85"/>
  <text x="348" y="209" class="mono" font-size="14" fill="#b8c4d4" text-anchor="middle">hd-a11y-scan</text>

  <g class="mono" font-size="17">
    <text class="tl d1" x="76" y="264"><tspan fill="#4ade80">$</tspan><tspan fill="#f8fafc"> npx hd-a11y-scan https://holmdigital.se</tspan></text>
    <text class="tl d2" x="76" y="306" font-weight="700" fill="#7dd3fc">HolmDigital Regulatory Scanner</text>
    <g class="tl d3">
      <path d="M78 330 l4.5 4.5 l8.5 -9" fill="none" stroke="#4ade80" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="100" y="336" fill="#cbd5e1">Scan complete!</text>
    </g>
    <text class="tl d4" x="76" y="384" font-size="19" font-weight="700" fill="#4ade80">[ Compliance Score: 100/100 ]</text>

    <g class="tl d5">
      <text x="76" y="426" fill="#cbd5e1">HTML Structure</text>
      <rect x="274" y="413" width="200" height="16" rx="3" fill="#1e293b"/>
      <rect class="bar d5" x="274" y="413" width="200" height="16" rx="3" fill="#22c55e"/>
      <text x="490" y="426" fill="#f8fafc">100%</text>
    </g>
    <g class="tl d6">
      <text x="76" y="458" fill="#cbd5e1">Keyboard Nav</text>
      <rect x="274" y="445" width="200" height="16" rx="3" fill="#1e293b"/>
      <rect class="bar d6" x="274" y="445" width="200" height="16" rx="3" fill="#22c55e"/>
      <text x="490" y="458" fill="#f8fafc">100%</text>
    </g>
    <g class="tl d7">
      <text x="76" y="490" fill="#cbd5e1">Contrast</text>
      <rect x="274" y="477" width="200" height="16" rx="3" fill="#1e293b"/>
      <rect class="bar d7" x="274" y="477" width="200" height="16" rx="3" fill="#22c55e"/>
      <text x="490" y="490" fill="#f8fafc">100%</text>
    </g>

    <line class="tl d7" x1="76" y1="514" x2="620" y2="514" stroke="#1e293b" stroke-width="2"/>
    <g class="tl d8">
      <path d="M78 540 l4.5 4.5 l8.5 -9" fill="none" stroke="#4ade80" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="100" y="546" font-weight="700" fill="#4ade80">Legal Risk: LOW</text>
      <text x="100" y="576" fill="#b8c4d4">No critical violations found.</text>
    </g>
  </g>

  <!-- Mapping chain -->
  <text x="690" y="200" font-size="14" font-weight="700" letter-spacing="2.5" fill="#b8c4d4">HOW ONE FINDING IS MAPPED</text>
  <line x1="672" y1="249" x2="672" y2="577" stroke="#334155" stroke-width="2"/>

  <g class="node n1">
    <circle cx="672" cy="249" r="6" fill="#38bdf8"/>
    <rect x="690" y="216" width="462" height="66" rx="12" fill="#0f172a" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="714" y="242" font-size="13" font-weight="700" letter-spacing="2" fill="#7dd3fc">FINDING</text>
    <text x="714" y="268" font-size="19" font-weight="600" fill="#f8fafc"><tspan class="mono" fill="#fda4af">&lt;img&gt;</tspan> without alt text</text>
  </g>
  <g class="node n2">
    <circle cx="672" cy="331" r="6" fill="#38bdf8"/>
    <rect x="690" y="298" width="462" height="66" rx="12" fill="#0f172a" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="714" y="324" font-size="13" font-weight="700" letter-spacing="2" fill="#7dd3fc">WCAG 2.2</text>
    <text x="714" y="350" font-size="19" font-weight="600" fill="#f8fafc">1.1.1 Non-text Content, Level A</text>
  </g>
  <g class="node n3">
    <circle cx="672" cy="413" r="6" fill="#38bdf8"/>
    <rect x="690" y="380" width="462" height="66" rx="12" fill="#0f172a" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="714" y="406" font-size="13" font-weight="700" letter-spacing="2" fill="#7dd3fc">EN 301 549</text>
    <text x="714" y="432" font-size="19" font-weight="600" fill="#f8fafc">Clause 9.1.1.1</text>
  </g>
  <g class="node n4">
    <circle cx="672" cy="495" r="6" fill="#38bdf8"/>
    <rect x="690" y="462" width="462" height="66" rx="12" fill="#0f172a" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="714" y="488" font-size="13" font-weight="700" letter-spacing="2" fill="#7dd3fc">EU LAW</text>
    <text x="714" y="514" font-size="19" font-weight="600" fill="#f8fafc">EAA Annex I, WAD Article 4</text>
  </g>
  <g class="node n5">
    <circle cx="672" cy="577" r="6" fill="#4ade80"/>
    <rect x="690" y="544" width="462" height="66" rx="12" fill="#052e16" fill-opacity="0.55" stroke="#22c55e" stroke-width="1.5"/>
    <text x="714" y="570" font-size="13" font-weight="700" letter-spacing="2" fill="#86efac">SWEDEN, PRIVATE SECTOR</text>
    <text x="714" y="596" font-size="19" font-weight="600" fill="#f8fafc">Lag (2023:254), enforced by PTS</text>
  </g>
</svg>
